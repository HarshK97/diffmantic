name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

# Group runs by workflow and ref/PR number.
# Cancel in-progress runs on pull requests, but always let runs on 'main' complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --timeout=5m

      - name: Verify formatting (golangci-lint fmt)
        run: golangci-lint fmt --diff ./...

  test-linux:
    name: Test & Coverage (Linux)
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run test suite with coverage
        run: >-
          gotestsum --format pkgname --junitfile unit-tests.xml --
          -coverprofile=coverage.out -covermode=atomic -coverpkg=./...
          ./...

      - name: Print & publish coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1
          echo "### 🧪 Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -15 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/unit-tests.xml'
          check_name: 'Test Report (ubuntu-latest)'

  test-cross:
    name: Cross-Platform Test
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run test suite
        run: gotestsum --format pkgname --junitfile unit-tests.xml -- ./...

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/unit-tests.xml'
          check_name: 'Test Report (${{ matrix.os }})'
