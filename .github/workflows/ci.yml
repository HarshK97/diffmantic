name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  checks: write

# Group runs by workflow and ref/PR number.
# Cancel in-progress runs on pull requests, but always let runs on 'main' complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --timeout=5m

      - name: Verify formatting (golangci-lint fmt)
        run: golangci-lint fmt --diff ./...

  test-linux:
    name: Test & Coverage (Linux)
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run test suite with coverage
        run: >-
          gotestsum --format pkgname --junitfile unit-tests.xml --
          -coverprofile=coverage.out -covermode=atomic -coverpkg=./...
          ./...

      - name: Print & publish coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1
          echo "### 🧪 Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -15 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/unit-tests.xml'
          check_name: 'Test Report (ubuntu-latest)'

  test-cross:
    name: Cross-Platform Test
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run test suite
        run: gotestsum --format pkgname --junitfile unit-tests.xml -- ./...

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/unit-tests.xml'
          check_name: 'Test Report (${{ matrix.os }})'

  benchmark-stage:
    name: Benchmark Sub-System Stage
    needs: [lint, test-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check performance-critical file changes & determine stage target
        id: filter
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          CHANGED=$(git diff --name-only $BASE_REF HEAD || true)
          echo "Changed files:"
          echo "$CHANGED"

          PRIMARY_STAGE=""
          if echo "$CHANGED" | grep -qE '^internal/treesitter/'; then
            PRIMARY_STAGE="BenchmarkParse"
          elif echo "$CHANGED" | grep -qE '^internal/engine/'; then
            PRIMARY_STAGE="BenchmarkMatch"
          elif echo "$CHANGED" | grep -qE '^internal/actions/'; then
            PRIMARY_STAGE="BenchmarkEditScript"
          elif echo "$CHANGED" | grep -qE '^internal/postprocess/'; then
            PRIMARY_STAGE="BenchmarkPostprocess"
          elif echo "$CHANGED" | grep -qE '^internal/serialize/'; then
            PRIMARY_STAGE="BenchmarkSerialize"
          fi

          if [ -n "$PRIMARY_STAGE" ]; then
            echo "run_stage=true" >> $GITHUB_OUTPUT
            echo "primary_stage=$PRIMARY_STAGE" >> $GITHUB_OUTPUT
            echo "Selected sub-system benchmark: $PRIMARY_STAGE"
          else
            echo "run_stage=false" >> $GITHUB_OUTPUT
            echo "No sub-system specific files changed. Skipping stage benchmark."
          fi

      - name: Set up Go
        if: steps.filter.outputs.run_stage == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Install benchstat
        if: steps.filter.outputs.run_stage == 'true'
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run Sub-System Stage Benchmark
        if: steps.filter.outputs.run_stage == 'true'
        env:
          PRIMARY_STAGE: ${{ steps.filter.outputs.primary_stage }}
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          echo "==> Running Sub-System Stage Benchmark: $PRIMARY_STAGE on PR HEAD..."
          go test ./tests/integration/ -bench="^${PRIMARY_STAGE}$" -benchmem -run=^$ -count=3 > bench_stage_new.txt

          echo "==> Fetching baseline and running $PRIMARY_STAGE..."
          git checkout $BASE_REF || true
          go test ./tests/integration/ -bench="^${PRIMARY_STAGE}$" -benchmem -run=^$ -count=3 > bench_stage_old.txt || true
          git checkout ${{ github.sha }} || git checkout - || true

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          benchstat bench_stage_old.txt bench_stage_new.txt > bench_stage_raw.txt || true
          python3 .github/scripts/format_benchstat.py bench_stage_raw.txt --run-url "$RUN_URL" --title "### 🎯 Sub-System Stage Benchmark: $PRIMARY_STAGE" >> $GITHUB_STEP_SUMMARY || cat bench_stage_raw.txt >> $GITHUB_STEP_SUMMARY
          rm -f bench_stage_new.txt bench_stage_old.txt bench_stage_raw.txt

  benchmark-pipeline:
    name: Benchmark Pipeline (E2E)
    needs: [lint, test-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check performance-critical file changes
        id: filter
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          CHANGED=$(git diff --name-only $BASE_REF HEAD || true)
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^(internal/engine/|internal/treesitter/|internal/actions/|internal/postprocess/|internal/serialize/|tests/integration/|go\.mod|go\.sum)'; then
            echo "::notice::Performance-critical files changed. Running E2E pipeline benchmark..."
            echo "run_benchmarks=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::No performance-critical files changed. Skipping pipeline benchmark."
            echo "run_benchmarks=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Go
        if: steps.filter.outputs.run_benchmarks == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Install benchstat
        if: steps.filter.outputs.run_benchmarks == 'true'
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run End-to-End Pipeline Benchmark
        if: steps.filter.outputs.run_benchmarks == 'true'
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          echo "==> Running End-to-End Benchmark: BenchmarkPipeline on PR HEAD..."
          go test ./tests/integration/ -bench="^BenchmarkPipeline$" -benchmem -run=^$ -count=3 > bench_pipe_new.txt

          echo "==> Fetching baseline and running BenchmarkPipeline..."
          git checkout $BASE_REF || true
          go test ./tests/integration/ -bench="^BenchmarkPipeline$" -benchmem -run=^$ -count=3 > bench_pipe_old.txt || true
          git checkout ${{ github.sha }} || git checkout - || true

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          benchstat bench_pipe_old.txt bench_pipe_new.txt > bench_pipe_raw.txt || true
          python3 .github/scripts/format_benchstat.py bench_pipe_raw.txt --run-url "$RUN_URL" --title "### 🚀 End-to-End Benchmark: BenchmarkPipeline" >> $GITHUB_STEP_SUMMARY || cat bench_pipe_raw.txt >> $GITHUB_STEP_SUMMARY
          rm -f bench_pipe_new.txt bench_pipe_old.txt bench_pipe_raw.txt
