name: Benchmark Command

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  benchmark:
    name: Benchmark PR (Command Triggered)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/benchmark') || startsWith(github.event.comment.body, '/bench')))
    runs-on: ubuntu-latest

    steps:
      - name: Add reaction to PR comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Get PR details
        id: pr_details
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              core.setOutput('head_ref', pr.head.ref);
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('base_sha', pr.base.sha);
              core.setOutput('pull_number', pr.number);
            }

      - name: Verify CI checks (lint & tests) have passed
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = '${{ steps.pr_details.outputs.head_sha }}';
            if (!headSha) return;

            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
            });

            const requiredChecks = checkRuns.check_runs.filter(run => 
              run.name.includes('Lint') || run.name.includes('Test')
            );

            const pending = requiredChecks.filter(run => run.status !== 'completed');
            const failed = requiredChecks.filter(run => run.status === 'completed' && run.conclusion !== 'success');

            if (pending.length > 0) {
              core.setFailed(`Cannot run benchmarks: CI checks are still in progress (${pending.map(c => c.name).join(', ')}).`);
            } else if (failed.length > 0) {
              core.setFailed(`Cannot run benchmarks: CI checks failed (${failed.map(c => c.name).join(', ')}).`);
            } else {
              core.info('All required CI checks (lint and test suite) passed. Proceeding with benchmarks.');
            }

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_details.outputs.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks on PR HEAD
        run: go test ./tests/integration/ -bench=BenchmarkPipeline -benchmem -run=^$ -count=3 > bench_new.txt

      - name: Fetch and run benchmarks on baseline branch
        run: |
          BASE_SHA="${{ steps.pr_details.outputs.base_sha || 'HEAD~1' }}"
          git checkout $BASE_SHA || true
          go test ./tests/integration/ -bench=BenchmarkPipeline -benchmem -run=^$ -count=3 > bench_old.txt || true
          echo "==> Restoring PR HEAD commit..."
          git checkout ${{ steps.pr_details.outputs.head_sha || github.sha }} || true

      - name: Render Benchmark A/B Summary
        run: |
          benchstat bench_old.txt bench_new.txt > benchstat_raw.txt || true
          python3 .github/scripts/format_benchstat.py benchstat_raw.txt > benchstat_summary.md || true
          cat benchstat_summary.md >> $GITHUB_STEP_SUMMARY || cat benchstat_raw.txt >> $GITHUB_STEP_SUMMARY

      - name: Update PR Description Body with Benchmark Results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('benchstat_summary.md')) return;
            const benchReport = fs.readFileSync('benchstat_summary.md', 'utf8').trim();
            if (!benchReport) return;

            const pullNumber = parseInt('${{ steps.pr_details.outputs.pull_number }}') || context.issue.number;
            if (!pullNumber) return;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            let currentBody = pr.body || '';
            const benchHeader = '### 📊 Benchmark A/B Comparison Report';
            let newBody = '';

            if (currentBody.includes(benchHeader)) {
              const parts = currentBody.split(benchHeader);
              newBody = parts[0].trim() + '\n\n' + benchReport;
            } else if (currentBody.includes('### Benchmark Results')) {
              const parts = currentBody.split('### Benchmark Results');
              newBody = parts[0].trim() + '\n\n' + benchReport;
            } else {
              newBody = currentBody.trim() + '\n\n' + benchReport;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              body: newBody,
            });
