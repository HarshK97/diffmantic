name: Benchmark Command

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  benchmark:
    name: Benchmark PR (Command Triggered)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, '/benchmark') || contains(github.event.comment.body, '/bench')))
    runs-on: ubuntu-latest

    steps:
      - name: Add reaction & notify PR description (In-Progress)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

            const pullNumber = context.issue.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const benchHeader = '### 📊 Benchmark A/B Comparison Report';
            const inProgressMsg = `${benchHeader}\n> ⏳ **Benchmark run in progress...** 🔗 [View Live Action Logs](${runUrl})`;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            let currentBody = pr.body || '';
            let newBody = '';
            if (currentBody.includes(benchHeader)) {
              const parts = currentBody.split(benchHeader);
              newBody = parts[0].trim() + '\n\n' + inProgressMsg;
            } else if (currentBody.includes('### Benchmark Results')) {
              const parts = currentBody.split('### Benchmark Results');
              newBody = parts[0].trim() + '\n\n' + inProgressMsg;
            } else {
              newBody = currentBody.trim() + '\n\n' + inProgressMsg;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              body: newBody,
            });

      - name: Get PR details & determine benchmark target
        id: pr_details
        uses: actions/github-script@v7
        with:
          script: |
            let benchTarget = 'BenchmarkPipeline';
            if (context.eventName === 'issue_comment') {
              const body = (context.payload.comment.body || '').toLowerCase();
              if (body.includes('parse')) benchTarget = 'BenchmarkParse';
              else if (body.includes('match')) benchTarget = 'BenchmarkMatch';
              else if (body.includes('editscript')) benchTarget = 'BenchmarkEditScript';
              else if (body.includes('postprocess')) benchTarget = 'BenchmarkPostprocess';
              else if (body.includes('serialize')) benchTarget = 'BenchmarkSerialize';

              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              core.setOutput('head_ref', pr.head.ref);
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('base_sha', pr.base.sha);
              core.setOutput('pull_number', pr.number);
            }
            core.setOutput('bench_target', benchTarget);

      - name: Verify CI checks (lint & tests) have passed
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = '${{ steps.pr_details.outputs.head_sha }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const benchHeader = '### 📊 Benchmark A/B Comparison Report';
            const pullNumber = parseInt('${{ steps.pr_details.outputs.pull_number }}') || context.issue.number;

            async function updatePrBlocked(msg) {
              if (!pullNumber) return;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });
              let currentBody = pr.body || '';
              const blockedText = `${benchHeader}\n> ❌ **Benchmark blocked:** ${msg} 🔗 [View Action Logs](${runUrl})`;
              let newBody = currentBody.includes(benchHeader)
                ? currentBody.split(benchHeader)[0].trim() + '\n\n' + blockedText
                : currentBody.trim() + '\n\n' + blockedText;
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                body: newBody,
              });
            }

            if (!headSha) return;

            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
            });

            const requiredChecks = checkRuns.check_runs.filter(run => 
              run.name.includes('Lint') || run.name.includes('Test')
            );

            const pending = requiredChecks.filter(run => run.status !== 'completed');
            const failed = requiredChecks.filter(run => run.status === 'completed' && run.conclusion !== 'success');

            if (requiredChecks.length === 0) {
              const msg = "CI checks (lint/test) have not registered or started yet.";
              await updatePrBlocked(msg);
              core.setFailed(`Cannot run benchmarks: ${msg}`);
            } else if (pending.length > 0) {
              const msg = `CI checks are still in progress (${pending.map(c => c.name).join(', ')}).`;
              await updatePrBlocked(msg);
              core.setFailed(`Cannot run benchmarks: ${msg}`);
            } else if (failed.length > 0) {
              const msg = `CI checks failed (${failed.map(c => c.name).join(', ')}).`;
              await updatePrBlocked(msg);
              core.setFailed(`Cannot run benchmarks: ${msg}`);
            } else {
              core.info('All required CI checks (lint and test suite) passed. Proceeding with benchmarks.');
            }

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_details.outputs.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks on PR HEAD
        run: go test ./tests/integration/ -bench=${{ steps.pr_details.outputs.bench_target || 'BenchmarkPipeline' }} -benchmem -run=^$ -count=3 > bench_new.txt

      - name: Fetch and run benchmarks on baseline branch
        run: |
          git fetch origin main:main || true
          BASE_SHA="${{ steps.pr_details.outputs.base_sha || 'main' }}"
          git checkout $BASE_SHA || true
          go test ./tests/integration/ -bench=${{ steps.pr_details.outputs.bench_target || 'BenchmarkPipeline' }} -benchmem -run=^$ -count=3 > bench_old.txt || true
          echo "==> Restoring PR HEAD commit..."
          git checkout ${{ steps.pr_details.outputs.head_sha || github.sha }} || true

      - name: Render Benchmark A/B Summary
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          benchstat bench_old.txt bench_new.txt > benchstat_raw.txt || true
          python3 .github/scripts/format_benchstat.py benchstat_raw.txt --pr --run-url "$RUN_URL" > benchstat_summary.md || true
          python3 .github/scripts/format_benchstat.py benchstat_raw.txt >> $GITHUB_STEP_SUMMARY || cat benchstat_raw.txt >> $GITHUB_STEP_SUMMARY

      - name: Update PR Description Body with Benchmark Results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('benchstat_summary.md')) return;
            const benchReport = fs.readFileSync('benchstat_summary.md', 'utf8').trim();
            if (!benchReport) return;

            const pullNumber = parseInt('${{ steps.pr_details.outputs.pull_number }}') || context.issue.number;
            if (pullNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });

              let currentBody = pr.body || '';
              const benchHeader = '### 📊 Benchmark A/B Comparison Report';
              let newBody = '';

              if (currentBody.includes(benchHeader)) {
                const parts = currentBody.split(benchHeader);
                newBody = parts[0].trim() + '\n\n' + benchReport;
              } else if (currentBody.includes('### Benchmark Results')) {
                const parts = currentBody.split('### Benchmark Results');
                newBody = parts[0].trim() + '\n\n' + benchReport;
              } else {
                newBody = currentBody.trim() + '\n\n' + benchReport;
              }

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                body: newBody,
              });
            }

            const headSha = '${{ steps.pr_details.outputs.head_sha }}';
            if (headSha) {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Benchmark A/B Comparison',
                head_sha: headSha,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: 'Benchmark A/B Comparison Completed',
                  summary: 'PR description updated with benchmark results.',
                }
              });
            }
