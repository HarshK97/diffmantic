name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required by GoReleaser to determine changes and tags
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: false
          cache-dependency-path: 'go.sum'

      - name: Run test suite (pre-release verification)
        run: go test -v ./...

      - name: Verify CHANGELOG has release version header and extract notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::Missing release section '## [${VERSION}]' in CHANGELOG.md! Please update CHANGELOG.md before tagging."
            exit 1
          fi

          awk -v tag="$VERSION" '$0 ~ "^## \\[" tag "\\]" { flag=1; next } flag && /^## \[/ { flag=0 } flag { print }' CHANGELOG.md > /tmp/RELEASE_NOTES.md
          if [ ! -s /tmp/RELEASE_NOTES.md ]; then
            echo "::error::Release section '## [${VERSION}]' in CHANGELOG.md is empty! Please add release notes before tagging."
            exit 1
          fi

          echo "" >> /tmp/RELEASE_NOTES.md
          echo "---" >> /tmp/RELEASE_NOTES.md
          echo "**Full Changelog**: https://github.com/HarshK97/diffmantic/blob/main/CHANGELOG.md" >> /tmp/RELEASE_NOTES.md
          echo "Extracted release notes for version $VERSION successfully."

      - name: Verify CLI version matches release tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CLI_OUTPUT=$(go run ./cmd/diffm --version)
          CLI_VERSION=$(echo "$CLI_OUTPUT" | awk '{print $NF}')
          echo "Release tag version: $TAG_VERSION"
          echo "CLI version output:  $CLI_OUTPUT ($CLI_VERSION)"
          if [ "$TAG_VERSION" != "$CLI_VERSION" ]; then
            echo "::error::Version mismatch! Release tag is v$TAG_VERSION but diffm --version outputs $CLI_VERSION. Please bump Version in cmd/root.go."
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION matches CLI binary."

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.16.0
          args: release --clean --release-notes=/tmp/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
