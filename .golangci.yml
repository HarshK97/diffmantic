version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - wastedassign
    - nilerr
    - unconvert
    - copyloopvar
  exclusions:
    paths:
      - native/bridge/grammars

formatters:
  enable:
    - gofumpt
    - goimports
    - gci
  exclusions:
    paths:
      - native/bridge/grammars
