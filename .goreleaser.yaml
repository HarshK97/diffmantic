version: 2
project_name: diffmantic

before:
  hooks:
    - go mod tidy

builds:
  - id: diffmantic
    main: ./cmd/diffm
    binary: diffm
    flags:
      - -trimpath
    ldflags:
      - -s -w
    tags:
      - grammar_subset
      - grammar_subset_c
      - grammar_subset_cpp
      - grammar_subset_css
      - grammar_subset_go
      - grammar_subset_html
      - grammar_subset_java
      - grammar_subset_javascript
      - grammar_subset_json
      - grammar_subset_lua
      - grammar_subset_php
      - grammar_subset_python
      - grammar_subset_ruby
      - grammar_subset_rust
      - grammar_subset_toml
      - grammar_subset_tsx
      - grammar_subset_typescript
      - grammar_subset_yaml
      - grammar_subset_zig
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: diffmantic-archive
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"


release:
  mode: replace
  prerelease: true

brews:
  - name: diffmantic
    repository:
      owner: HarshK97
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/HarshK97/diffmantic"
    description: "Structural, semantic diff engine powered by Tree-sitter"
    license: "MIT"
    install: |
      bin.install "diffm"
    test: |
      system "#{bin}/diffm --version"

