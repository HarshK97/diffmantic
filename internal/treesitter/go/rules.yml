flattened:
  - interpreted_string_literal
aliased:
  # Arithmetic operators
  "+": arithmetic_operator_literal
  "-": arithmetic_operator_literal
  "*": arithmetic_operator_literal
  "/": arithmetic_operator_literal
  "%": arithmetic_operator_literal

  # Comparison operators
  "==": comparison_operator_literal
  "!=": comparison_operator_literal
  "<": comparison_operator_literal
  "<=": comparison_operator_literal
  ">": comparison_operator_literal
  ">=": comparison_operator_literal

  # Logical operators
  "&&": logical_operator_literal
  "||": logical_operator_literal

  # Assignment operators
  "=": assignment_operator_literal
  ":=": assignment_operator_literal
  "+=": assignment_operator_literal
  "-=": assignment_operator_literal
  "*=": assignment_operator_literal
  "/=": assignment_operator_literal
  "%=": assignment_operator_literal
  "&=": assignment_operator_literal
  "|=": assignment_operator_literal
  "^=": assignment_operator_literal
  "<<=": assignment_operator_literal
  ">>=": assignment_operator_literal
  "&^=": assignment_operator_literal

  # Bitwise and other operators
  "&": bitwise_operator_literal
  "|": bitwise_operator_literal
  "^": bitwise_operator_literal
  "<<": bitwise_operator_literal
  ">>": bitwise_operator_literal
  "&^": bitwise_operator_literal

  # Unary/Channel operators
  "!": unary_operator_literal
  "<-": channel_operator_literal

  # Increment/Decrement operators
  "++": update_operator_literal
  "--": update_operator_literal

ignored:
  - "\n"
  - "("
  - ")"
  - "{"
  - "}"
  - "["
  - "]"
  - ","
  - ";"
  - ":"
  - "."

scaffolding:
  - source_file
  - block
  - argument_list
  - parameter_list
  - parenthesized_expression
  - expression_list
  - literal_value
  - statement_list
  - import_spec_list
  - function_declaration
  - method_declaration
  - if_statement
  - for_statement
  - expression_switch_statement
  - type_switch_statement
  - select_statement
  - select_case
  - communication_case
  - default_case
  - expression_case
  - type_case

keywords:
  - func
  - package
  - import
  - var
  - const
  - type
  - struct
  - interface
  - if
  - else
  - switch
  - case
  - default
  - for
  - range
  - return
  - break
  - continue
  - goto
  - defer
  - go
  - select
  - map
  - chan

declarations:
  - function_declaration
  - method_declaration
  - type_declaration
  - type_spec
  - type_alias
  - parameter_declaration
  - field_declaration
  - const_declaration
  - var_declaration

unordered:
  - interface_type



