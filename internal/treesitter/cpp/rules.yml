flattened:
  - string_literal
  - char_literal
  - system_lib_string
  - concatenated_string
  - raw_string_literal
  - comment
aliased:
  # Keywords
  "if": "condition_declaration"
  "else": "else"
  "switch": "switch"
  "case": "case"
  "default": "default"
  "for": "for"
  "while": "while"
  "do": "do"
  "return": "return"
  "break": "break"
  "continue": "continue"
  "goto": "goto"
  "struct": "struct"
  "union": "union"
  "enum": "enum"
  "typedef": "typedef"
  "const": "const"
  "volatile": "volatile"
  "static": "static"
  "extern": "extern"
  "inline": "inline"
  "register": "register"
  "auto": "auto"
  "restrict": "restrict"
  "sizeof": "sizeof"
  "alignof": "alignof"
  "class": "class"
  "namespace": "namespace"
  "template": "template"
  "typename": "typename"
  "public": "public"
  "private": "private"
  "protected": "protected"
  "virtual": "virtual"
  "override": "override"
  "final": "final"
  "constexpr": "constexpr"
  "consteval": "consteval"
  "constinit": "constinit"
  "noexcept": "noexcept"
  "explicit": "explicit"
  "mutable": "mutable"
  "friend": "friend"
  "using": "using"
  "concept": "concept"
  "requires": "requires"
  "try": "try"
  "catch": "catch"
  "throw": "throw"
  "co_return": "co_return"
  "co_yield": "co_yield"
  "co_await": "co_await"
  "new": "new"
  "delete": "delete"
  "decltype": "decltype"
  "static_assert": "static_assert"
  "nullptr": "nullptr"
  "this": "this"

  # Arithmetic operators
  "+": arithmetic_operator_literal
  "-": arithmetic_operator_literal
  "*": arithmetic_operator_literal
  "/": arithmetic_operator_literal
  "%": arithmetic_operator_literal

  # Comparison operators
  "==": comparison_operator_literal
  "!=": comparison_operator_literal
  "<": comparison_operator_literal
  "<=": comparison_operator_literal
  ">": comparison_operator_literal
  ">=": comparison_operator_literal
  "<=>": comparison_operator_literal

  # Logical operators
  "&&": logical_operator_literal
  "||": logical_operator_literal
  "!": unary_operator_literal

  # Assignment operators
  "=": assignment_operator_literal
  "+=": assignment_operator_literal
  "-=": assignment_operator_literal
  "*=": assignment_operator_literal
  "/=": assignment_operator_literal
  "%=": assignment_operator_literal
  "&=": assignment_operator_literal
  "|=": assignment_operator_literal
  "^=": assignment_operator_literal
  "<<=": assignment_operator_literal
  ">>=": assignment_operator_literal

  # Bitwise operators
  "&": bitwise_operator_literal
  "|": bitwise_operator_literal
  "^": bitwise_operator_literal
  "~": bitwise_operator_literal
  "<<": bitwise_operator_literal
  ">>": bitwise_operator_literal

  # Increment/Decrement operators
  "++": update_operator_literal
  "--": update_operator_literal

  # Scope & Member access & Punctuation
  "::": scope_resolution
  ".": dot
  "->": arrow
  ",": comma
  ";": semicolon
  ":": colon
  "?": question_mark

  # Preprocessor keywords
  "#include": preproc_include
  "#define": preproc_def
  "#ifdef": preproc_ifdef
  "#ifndef": preproc_ifndef
  "#if": preproc_if
  "#else": preproc_else
  "#elif": preproc_elif
  "#endif": preproc_endif
  "#undef": preproc_undef

ignored:
  - "\n"

scaffolding:
  - translation_unit
  - compound_statement
  - declaration_list
  - field_declaration_list
  - enumerator_list
  - parameter_list
  - argument_list
  - parenthesized_expression
  - initializer_list
  - function_definition
  - type_definition
  - struct_specifier
  - union_specifier
  - enum_specifier
  - class_specifier
  - namespace_definition
  - template_declaration
  - template_parameter_list
  - template_argument_list
  - if_statement
  - else_clause
  - for_statement
  - for_range_loop
  - while_statement
  - do_statement
  - switch_statement
  - case_statement
  - try_statement
  - catch_clause
  - lambda_expression
  - expression_statement
  - declaration
  - init_declarator
  - field_declaration
  - parameter_declaration
  - alias_declaration
  - using_declaration
  - concept_definition
  - static_assert_declaration
  - preproc_include
  - preproc_def
  - preproc_function_def
  - preproc_if
  - preproc_ifdef
  - preproc_else
  - preproc_elif
