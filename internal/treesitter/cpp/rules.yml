flattened:
  - string_literal
  - char_literal
  - system_lib_string
  - concatenated_string
  - raw_string_literal
  - comment
aliased:
  # Arithmetic operators
  "+": arithmetic_operator_literal
  "-": arithmetic_operator_literal
  "*": arithmetic_operator_literal
  "/": arithmetic_operator_literal
  "%": arithmetic_operator_literal

  # Comparison operators
  "==": comparison_operator_literal
  "!=": comparison_operator_literal
  "<": comparison_operator_literal
  "<=": comparison_operator_literal
  ">": comparison_operator_literal
  ">=": comparison_operator_literal
  "<=>": comparison_operator_literal

  # Logical operators
  "&&": logical_operator_literal
  "||": logical_operator_literal
  "!": unary_operator_literal

  # Assignment operators
  "=": assignment_operator_literal
  "+=": assignment_operator_literal
  "-=": assignment_operator_literal
  "*=": assignment_operator_literal
  "/=": assignment_operator_literal
  "%=": assignment_operator_literal
  "&=": assignment_operator_literal
  "|=": assignment_operator_literal
  "^=": assignment_operator_literal
  "<<=": assignment_operator_literal
  ">>=": assignment_operator_literal

  # Bitwise operators
  "&": bitwise_operator_literal
  "|": bitwise_operator_literal
  "^": bitwise_operator_literal
  "~": bitwise_operator_literal
  "<<": bitwise_operator_literal
  ">>": bitwise_operator_literal

  # Increment/Decrement operators
  "++": update_operator_literal
  "--": update_operator_literal

  # Preprocessor keywords
  "#include": preproc_include
  "#define": preproc_def
  "#ifdef": preproc_ifdef
  "#ifndef": preproc_ifndef
  "#if": preproc_if
  "#else": preproc_else
  "#elif": preproc_elif
  "#endif": preproc_endif
  "#undef": preproc_undef

ignored:
  - "\n"
  - "("
  - ")"
  - "{"
  - "}"
  - "["
  - "]"
  - ","
  - ";"
