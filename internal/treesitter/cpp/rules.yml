flattened:
  - string_literal
  - char_literal
  - system_lib_string
  - concatenated_string
  - raw_string_literal
  - comment
aliased:
  # Arithmetic operators
  "+": arithmetic_operator_literal
  "-": arithmetic_operator_literal
  "*": arithmetic_operator_literal
  "/": arithmetic_operator_literal
  "%": arithmetic_operator_literal

  # Comparison operators
  "==": comparison_operator_literal
  "!=": comparison_operator_literal
  "<": comparison_operator_literal
  "<=": comparison_operator_literal
  ">": comparison_operator_literal
  ">=": comparison_operator_literal
  "<=>": comparison_operator_literal

  # Logical operators
  "&&": logical_operator_literal
  "||": logical_operator_literal
  "!": unary_operator_literal

  # Assignment operators
  "=": assignment_operator_literal
  "+=": assignment_operator_literal
  "-=": assignment_operator_literal
  "*=": assignment_operator_literal
  "/=": assignment_operator_literal
  "%=": assignment_operator_literal
  "&=": assignment_operator_literal
  "|=": assignment_operator_literal
  "^=": assignment_operator_literal
  "<<=": assignment_operator_literal
  ">>=": assignment_operator_literal

  # Bitwise operators
  "&": bitwise_operator_literal
  "|": bitwise_operator_literal
  "^": bitwise_operator_literal
  "~": bitwise_operator_literal
  "<<": bitwise_operator_literal
  ">>": bitwise_operator_literal

  # Increment/Decrement operators
  "++": update_operator_literal
  "--": update_operator_literal

  # Preprocessor keywords
  "#include": preproc_include
  "#define": preproc_def
  "#ifdef": preproc_ifdef
  "#ifndef": preproc_ifndef
  "#if": preproc_if
  "#else": preproc_else
  "#elif": preproc_elif
  "#endif": preproc_endif
  "#undef": preproc_undef

ignored:
  - "\n"
  - "("
  - ")"
  - "{"
  - "}"
  - "["
  - "]"
  - ","
  - ";"
  - ":"
  - "."
  - "?"
  - "->"
  - "::"

scaffolding:
  - translation_unit
  - compound_statement
  - declaration_list
  - field_declaration_list
  - enumerator_list
  - parameter_list
  - argument_list
  - parenthesized_expression
  - initializer_list
  - function_definition
  - type_definition
  - struct_specifier
  - union_specifier
  - enum_specifier
  - class_specifier
  - namespace_definition
  - template_declaration
  - template_parameter_list
  - template_argument_list
  - if_statement
  - else_clause
  - for_statement
  - for_range_loop
  - while_statement
  - do_statement
  - switch_statement
  - case_statement
  - try_statement
  - catch_clause
  - lambda_expression
  - expression_statement
  - declaration
  - init_declarator
  - field_declaration
  - parameter_declaration
  - alias_declaration
  - using_declaration
  - concept_definition
  - static_assert_declaration
  - preproc_include
  - preproc_def
  - preproc_function_def
  - preproc_if
  - preproc_ifdef
  - preproc_else
  - preproc_elif
