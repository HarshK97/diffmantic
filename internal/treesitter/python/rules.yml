flattened:
  - string
  - concatenated_string
  - comment
aliased:
  # Comparison operators
  "==": comparison_operator_literal
  "<=": comparison_operator_literal
  ">=": comparison_operator_literal
  "!=": comparison_operator_literal
  "<": comparison_operator_literal
  ">": comparison_operator_literal
  "<>": comparison_operator_literal
  "is": is_operator
  "is not": is_not_operator
  "not in": not_in_operator

  # Logical operators
  "and": logical_operator_literal
  "or": logical_operator_literal
  "not": unary_operator_literal

  # Assignment operators
  "=": assignment_operator_literal
  ":=": assignment_operator_literal
  "-=": assignment_operator_literal
  "+=": assignment_operator_literal
  "*=": assignment_operator_literal
  "/=": assignment_operator_literal
  "//=": assignment_operator_literal
  "%=": assignment_operator_literal
  "**=": assignment_operator_literal
  "&=": assignment_operator_literal
  "|=": assignment_operator_literal
  "^=": assignment_operator_literal
  "<<=": assignment_operator_literal
  ">>=": assignment_operator_literal
  "@=": assignment_operator_literal
  "augmented_assignment": assignment

  # Arithmetic operators
  "+": arithmetic_operator_literal
  "-": arithmetic_operator_literal
  "*": arithmetic_operator_literal
  "/": arithmetic_operator_literal
  "//": arithmetic_operator_literal
  "%": arithmetic_operator_literal
  "**": arithmetic_operator_literal

  # Bitwise operators
  "&": bitwise_operator_literal
  "|": bitwise_operator_literal
  "^": bitwise_operator_literal
  "<<": bitwise_operator_literal
  ">>": bitwise_operator_literal
  "~": bitwise_operator_literal

  # Keywords
  "def": "def"
  "class": "class"
  "try": "try"
  "except": "except"
  "finally": "finally"
  "raise": "raise"
  "del": "del"
  "for": "for"
  "while": "while"
  "if": "condition_declaration"
  "elif": "condition_declaration"
  "else": "else"
  "match": "match"
  "case": "case"
  "assert": "assert"
  "return": "return"
  "with": "with"
  "pass": "pass"
  "break": "break"
  "continue": "continue"
  "import": "import"
  "from": "from"
  "as": "as"
  "yield": "yield"
  "async": "async"
  "await": "await"
  "global": "global"
  "nonlocal": "nonlocal"
  "exec": "exec"
  "type": "type"
  "print": "print"
  "lambda": "lambda"
  "in": "in"

  # Clauses and Statements
  "for_in_clause": "for_statement"

  # Punctuation
  # "(": "opening_paren"
  # ")": "closing_paren"
  # "{": opening_brace
  # "}": closing_brace
  # "[": opening_bracket
  # "]": closing_bracket
  ".": dot
  ":": colon
  ",": comma
  ";": semicolon
  "->": arrow
  "@": decorator_at

ignored:
  - "_newline"
  - "_indent"
  - "_dedent"
  - "line_continuation"
  - "escape_sequence"

scaffolding:
  - module
  - block
  - argument_list
  - parameters
  - lambda_parameters
  - parenthesized_expression
  - expression_statement
  - expression_list
  - pattern_list
  - tuple_expression
  - list
  - dictionary
  - set
  - tuple
  - list_comprehension
  - dictionary_comprehension
  - set_comprehension
  - generator_expression
  - for_in_clause
  - if_clause
  - try_statement
  - except_clause
  - finally_clause
  - function_definition
  - class_definition
  - with_statement
  - with_clause
  - for_statement
  - while_statement
  - if_statement
  - elif_clause
  - else_clause
  - match_statement
  - case_clause
  - decorated_definition
  - import_statement
  - import_from_statement
