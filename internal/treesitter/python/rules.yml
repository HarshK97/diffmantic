  - try_statement
  - except_clause
  - finally_clause
  - function_definition
  - class_definition
  - with_statement
  - with_clause
  - for_statement
  - while_statement
  - if_statement
  - elif_clause
  - else_clause
  - match_statement
  - case_clause
  - decorated_definition
  - import_statement
