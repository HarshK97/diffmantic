flattened:
  - string_scalar
  - double_quote_scalar
  - single_quote_scalar
  - plain_scalar
  - comment

ignored:
  - ":"
  - "-"
  - "{"
  - "}"
  - "["
  - "]"
  - ","
  - "?"

scaffolding:
  - stream
  - document
  - block_node
  - flow_node
  - block_mapping
  - block_mapping_pair
  - block_sequence
  - block_sequence_item
  - flow_mapping
  - flow_sequence
  - flow_pair

unordered:
  - block_mapping
  - flow_mapping

identifiers:
  - tag
  - anchor_name
  - alias_name

pairs:
  - block_mapping_pair
  - flow_pair

equivalent_types:
  - [block_mapping, flow_mapping]
  - [block_sequence, flow_sequence]

