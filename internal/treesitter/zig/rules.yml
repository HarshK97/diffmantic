flattened:
  - string_literal
  - multiline_string_literal
  - char_literal
  - line_comment
  - doc_comment

aliased:
  # Arithmetic operators
  "+": arithmetic_operator_literal
  "-": arithmetic_operator_literal
  "*": arithmetic_operator_literal
  "/": arithmetic_operator_literal
  "%": arithmetic_operator_literal
  "+%": arithmetic_operator_literal
  "-%": arithmetic_operator_literal
  "*%": arithmetic_operator_literal

  # Comparison operators
  "==": comparison_operator_literal
  "!=": comparison_operator_literal
  "<": comparison_operator_literal
  "<=": comparison_operator_literal
  ">": comparison_operator_literal
  ">=": comparison_operator_literal

  # Logical operators
  "and": logical_operator_literal
  "or": logical_operator_literal

  # Assignment operators
  "=": assignment_operator_literal
  "+=": assignment_operator_literal
  "-=": assignment_operator_literal
  "*=": assignment_operator_literal
  "/=": assignment_operator_literal
  "%=": assignment_operator_literal
  "+%=": assignment_operator_literal
  "-%=": assignment_operator_literal
  "*%=": assignment_operator_literal
  "&=": assignment_operator_literal
  "|=": assignment_operator_literal
  "^=": assignment_operator_literal
  "<<=": assignment_operator_literal
  ">>=": assignment_operator_literal

  # Bitwise operators
  "&": bitwise_operator_literal
  "|": bitwise_operator_literal
  "^": bitwise_operator_literal
  "<<": bitwise_operator_literal
  ">>": bitwise_operator_literal
  "~": bitwise_operator_literal

  # Unary / Pointer / Option operators
  "!": unary_operator_literal
  ".?": unary_operator_literal
  ".*": unary_operator_literal

ignored:
  - "\n"
  - "("
  - ")"
  - "{"
  - "}"
  - "["
  - "]"
  - ","
  - ";"
  - ":"
  - "."
  - "=>"
  - "->"

scaffolding:
  - source_file
  - Block
  - Statement
  - Expression
  - Decl
  - FnProto
  - ParamDecl
  - ContainerDecl
  - StructDecl
  - EnumDecl
  - UnionDecl
  - InitList

keywords:
  - fn
  - const
  - var
  - pub
  - export
  - extern
  - inline
  - noinline
  - comptime
  - struct
  - enum
  - union
  - error
  - type
  - void
  - bool
  - anytype
  - if
  - else
  - switch
  - while
  - for
  - return
  - break
  - continue
  - defer
  - errdefer
  - try
  - catch
  - unreachable
  - usingnamespace
  - test

declarations:
  - function_declaration
  - variable_declaration
  - struct_declaration
  - enum_declaration
  - union_declaration
  - opaque_declaration
  - error_set_declaration
  - test_declaration
  - using_namespace_declaration

identifiers:
  - identifier

pairs:

  - initializer_pair
  - field_initializer
  - container_field

equivalent_types:
  - [struct_declaration, enum_declaration, union_declaration, error_set_declaration, opaque_declaration]
  - [variable_declaration, comptime_declaration]
  - [for_statement, while_statement]


