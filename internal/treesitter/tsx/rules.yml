flattened:
  - string
  - template_string
  - comment
aliased:
  # Comparison operators
  "==": comparison_operator_literal
  "!=": comparison_operator_literal
  "===": comparison_operator_literal
  "!==": comparison_operator_literal
  "<": comparison_operator_literal
  "<=": comparison_operator_literal
  ">": comparison_operator_literal
  ">=": comparison_operator_literal

  # Logical operators
  "&&": logical_operator_literal
  "||": logical_operator_literal
  "??": logical_operator_literal

  # Assignment operators
  "=": assignment_operator_literal
  "+=": assignment_operator_literal
  "-=": assignment_operator_literal
  "*=": assignment_operator_literal
  "/=": assignment_operator_literal
  "%=": assignment_operator_literal
  "**=": assignment_operator_literal
  "&&=": assignment_operator_literal
  "||=": assignment_operator_literal
  "??=": assignment_operator_literal
  "&=": assignment_operator_literal
  "|=": assignment_operator_literal
  "^=": assignment_operator_literal
  "<<=": assignment_operator_literal
  ">>=": assignment_operator_literal
  ">>>=": assignment_operator_literal

  # Arithmetic operators
  "+": arithmetic_operator_literal
  "-": arithmetic_operator_literal
  "*": arithmetic_operator_literal
  "/": arithmetic_operator_literal
  "%": arithmetic_operator_literal
  "**": arithmetic_operator_literal

  # Bitwise operators
  "&": bitwise_operator_literal
  "|": bitwise_operator_literal
  "^": bitwise_operator_literal
  "<<": bitwise_operator_literal
  ">>": bitwise_operator_literal
  ">>>": bitwise_operator_literal

  # Unary / Update operators
  "!": unary_operator_literal
  "~": bitwise_operator_literal
  "++": update_operator_literal
  "--": update_operator_literal
  "=>": arrow

  # Keywords
  "if": "condition_declaration"
  "else": "else"
  "for": "for"
  "while": "while"
  "do": "do"
  "switch": "switch"
  "case": "case"
  "default": "default"
  "try": "try"
  "catch": "catch"
  "finally": "finally"
  "throw": "throw"
  "return": "return"
  "break": "break"
  "continue": "continue"
  "function": "function"
  "class": "class"
  "const": "const"
  "let": "let"
  "var": "var"
  "type": "type"
  "interface": "interface"
  "namespace": "namespace"
  "enum": "enum"
  "abstract": "abstract"
  "readonly": "readonly"
  "export": "export"
  "import": "import"
  "from": "from"
  "as": "as"
  "async": "async"
  "await": "await"

  # Punctuation
  ".": dot
  ":": colon
  ",": comma
  ";": semicolon
  "?.": optional_chaining

  # JSX element tags
  "/>": jsx_self_closing_tag_slash_gt
  "</": jsx_closing_tag_lt_slash

ignored:
  - "\n"
  - "escape_sequence"

scaffolding:
  - program
  - statement_block
  - formal_parameters
  - arguments
  - parenthesized_expression
  - expression_statement
  - function_declaration
  - method_definition
  - arrow_function
  - class_declaration
  - class_body
  - interface_declaration
  - interface_body
  - enum_declaration
  - enum_body
  - type_alias_declaration
  - if_statement
  - for_statement
  - for_in_statement
  - switch_statement
  - switch_body
  - switch_case
  - try_statement
  - catch_clause
  - import_statement
  - export_statement
  - object
  - array
  - type_arguments
  - type_parameters
  # JSX Scaffolding
  - jsx_element
  - jsx_self_closing_element
  - jsx_opening_element
  - jsx_closing_element
  - jsx_fragment
  - jsx_opening_fragment
  - jsx_closing_fragment
  - jsx_attribute
  - jsx_expression
